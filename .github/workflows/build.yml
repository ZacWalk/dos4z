name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    # Downloads demu and dimg from the libdos release pinned in make-dos.ps1
    - name: Build MS-DOS 4.0
      shell: pwsh
      run: .\make-dos.ps1

    # Boots the build in libdos's emulated IBM PC 5150: floppies, CHS and LBA
    # hard disks, FDISK and FORMAT, and unusual FAT layouts
    - name: Boot tests
      shell: pwsh
      run: .\test-boot.ps1
